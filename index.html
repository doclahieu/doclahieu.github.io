<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ĐỌC LÀ HIỂU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;1,300&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --giay:#EAF2F8; --giay-sau:#CADBE7; --the:#F7FAFC;
  --muc:#12304A; --muc-nhat:#3F6180;
  --do:#1D4568; --do-sau:#153753; --nau:#4F7FA8; --xanh:#1D4568;
  --vien:#97BCD7;
  --tieude:"Playfair Display","Noto Serif",Georgia,"Times New Roman",serif;
  --than:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; font-family:var(--than); font-size:16px; line-height:1.6; color:var(--muc);
  background-color:var(--giay);
  background-image:repeating-linear-gradient(0deg,rgba(29,69,104,.06) 0 1px,transparent 1px 30px);
  min-height:100vh; overflow-wrap:anywhere;
}
h1,h2,h3{font-family:var(--tieude); margin:0; line-height:1.3; font-weight:700}
p{margin:0}
[hidden]{display:none !important}
button,input{font:inherit; color:inherit}
:focus-visible{outline:3px solid var(--do); outline-offset:2px}
.wrap{max-width:720px; margin:0 auto; padding:0 16px}

/* nút */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  min-height:48px; padding:10px 22px; border:0; border-radius:6px; cursor:pointer;
  background:var(--do); color:#fff; font-weight:600; font-size:17px;
  box-shadow:0 2px 0 var(--do-sau);
}
.btn:hover{background:var(--do-sau)}
.btn:active{transform:translateY(1px); box-shadow:none}
.btn-phu{background:transparent; color:var(--muc); border:1.5px solid var(--nau); box-shadow:none; min-height:44px; padding:8px 16px; font-size:16px}
.btn-phu:hover{background:var(--giay-sau)}

.logo-ct{display:block;border-radius:50%;background:#fff;flex:none;box-shadow:0 0 0 2px var(--vien)}
.logo-ct.sm{width:36px;height:36px}
.logos{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 auto 22px}
#man-vao h1{margin:0 0 22px; line-height:1.15}
.logo-cho{display:grid;place-items:center;flex:none;width:22px;height:22px;border-radius:50%;background:var(--giay);border:1.5px dashed var(--vien)}
.logo-cho svg{width:12px;height:12px}
.logo-ct.nho{width:30px;height:30px}
/* dấu ấn đỏ */
.an{
  width:44px; height:44px; flex:none; display:grid; place-items:center;
  background:var(--do); color:#EAF2F8; font-family:var(--tieude); font-weight:700; font-size:22px;
  border-radius:4px; transform:rotate(-4deg); box-shadow:inset 0 0 0 2px rgba(255,255,255,.35);
}
.an.lon{width:64px; height:64px; font-size:32px; margin:0 auto 14px}

/* ===== Màn 1: Vào học ===== */
#man-vao{padding:10px 0 16px}
.khung{
  background:var(--the); border:2px solid var(--nau); border-radius:4px; padding:6px;
  box-shadow:0 6px 18px rgba(29,69,104,.15);
}
.khung-trong{
  border:1px solid var(--vien); padding:8px 18px 22px; text-align:center; position:relative;
  background:
    radial-gradient(circle at 0 0,var(--vien) 0 6px,transparent 7px) top left/0 0 no-repeat,
    var(--the);
}
.khung-trong::before,.khung-trong::after{
  content:"❖"; position:absolute; top:6px; color:var(--nau); font-size:14px; line-height:1;
}
.khung-trong::before{left:8px}
.khung-trong::after{right:8px}
.khung-trong h1{font-size:28px; color:var(--do-sau)}
.gioi-thieu{margin:28px auto 0; color:var(--muc-nhat); font-style:italic; font-weight:300; font-size:clamp(11px,3.5vw,14px); letter-spacing:.01em; white-space:nowrap}
.truong{text-align:left; margin-bottom:24px}
.truong label{display:block; font-weight:600; margin-bottom:12px}
.truong input{
  width:100%; min-height:52px; padding:10px 14px; border:2px solid var(--nau); border-radius:6px;
  background:#fff; font-size:20px; letter-spacing:.12em; text-transform:uppercase; text-align:center;
}
.truong input::placeholder{color:#6F8CA3; opacity:1; letter-spacing:.12em}
.truong input[aria-invalid="true"]{border-color:var(--do)}
.thongbao{
  text-align:left; margin:0 0 14px; padding:12px 14px; border-radius:6px;
  border:1.5px solid #B3261E; background:#FBE9E7; color:#7A1A12; font-weight:500;
}
.thongbao b{display:block}
#form-vao .btn{width:100%}
.hang-ma{display:flex; gap:10px; align-items:stretch; margin-bottom:8px}
#form-vao .hang-ma input{flex:1; min-width:0; width:auto; font-size:18px; letter-spacing:.08em; padding:10px 12px}
#form-vao .hang-ma input::placeholder{text-transform:none; letter-spacing:0; font-size:17px}
#form-vao .hang-ma .btn{width:auto; flex:none; padding-left:18px; padding-right:18px}
.ghi-nho{margin-top:14px; font-size:15px; color:var(--muc-nhat)}

/* ===== Thanh trên ===== */
.thanh{
  background:var(--muc); color:#EAF2F8; border-bottom:4px solid var(--do);
}
.thanh .wrap{display:flex; align-items:center; gap:10px; min-height:56px; padding-top:6px; padding-bottom:6px}
.thanh .an{width:36px; height:36px; font-size:18px}
.hs{margin-left:auto; text-align:right; font-weight:600; font-size:15px; line-height:1.3; min-width:0}
.hs small{display:block; font-weight:400; color:#CADBE7; font-size:13px}
.thanh .btn-quay{
  min-height:44px; padding:8px 14px; border:1.5px solid #97BCD7; background:transparent; color:#EAF2F8;
  border-radius:6px; cursor:pointer; font-weight:600; flex:none;
}
.thanh .btn-quay:hover{background:rgba(255,255,255,.12)}

/* ===== Màn 2: Trang chủ ===== */
.chao{padding:22px 0 6px}
.chao h2{font-size:24px; color:var(--do-sau)}
.chao p{color:var(--muc-nhat); margin-top:4px}
.nhom{margin-top:22px}
.nhom h3{
  font-size:22px; display:flex; align-items:center; gap:10px; padding-bottom:6px;
  border-bottom:2px double var(--nau); margin-bottom:12px;
}
.nhom h3 span.dem{font-family:var(--than); font-size:14px; font-weight:500; color:var(--muc-nhat)}
.ds{list-style:none; margin:0; padding:0; display:grid; gap:10px}
.the{
  width:100%; display:flex; align-items:center; gap:12px; text-align:left; cursor:pointer;
  min-height:64px; padding:10px 12px; background:var(--the); border:1.5px solid var(--vien);
  border-left:5px solid var(--nau); border-radius:4px;
}
.the:hover{background:#EAF2F8; border-color:var(--nau)}
.the .stt{
  flex:none; width:32px; height:32px; display:grid; place-items:center; border-radius:50%;
  border:1.5px solid var(--nau); font-family:var(--tieude); font-weight:700; font-size:15px; color:var(--nau);
}
.the .noidung{flex:1; min-width:0}
.the .ten{display:block; font-weight:600; line-height:1.35}
.the .tg{display:block; font-size:14px; color:var(--muc-nhat)}
.tt{
  flex:none; font-size:13px; font-weight:600; padding:4px 9px; border-radius:99px; white-space:nowrap;
  border:1.5px solid var(--nau); color:var(--muc-nhat); background:transparent;
}
.tt.da{background:var(--xanh); border-color:var(--xanh); color:#fff}
.sap{
  margin-top:24px; padding:12px 14px; border:1.5px dashed var(--nau); border-radius:4px;
  color:var(--muc-nhat); text-align:center;
}

/* ===== Màn 3: Trang học ===== */
.mang{background:#CADBE7; color:#12304A; border-bottom:1.5px solid #75A4C5; padding:10px 0; font-weight:500}
.mang .wrap{display:flex; align-items:center; gap:10px}
.quay{
  width:18px; height:18px; flex:none; border:3px solid #75A4C5; border-top-color:#12304A; border-radius:50%;
  animation:quay 1s linear infinite;
}
@keyframes quay{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.quay{animation:none}}
.hoc{padding:18px 16px 24px; display:grid; grid-template-columns:minmax(0,1fr); gap:0}
.hoc .cot-video{grid-area:mh; min-width:0}
.khung-hl iframe{display:block; width:100%; height:460px; border:0}
.khung-hl iframe.dang-tai{position:absolute; width:1px; height:1px; opacity:0; pointer-events:none}
.man-hinh .btn:disabled{opacity:.7; cursor:default}
.hoc .baitap{grid-area:bt}
.hoc{grid-template-areas:"mh" "bt"}
.man-hinh{
  position:relative; width:100%; aspect-ratio:16/9; border-radius:4px; overflow:hidden;
  border:2px solid var(--nau); box-shadow:0 0 0 4px var(--the),0 0 0 5px var(--vien);
  background:linear-gradient(135deg,#1D4568,#12304A);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; color:#EAF2F8; text-align:center; padding:8px;
}
.man-hinh::before{
  content:""; position:absolute; inset:8px; border:1px solid rgba(234,242,248,.35); pointer-events:none;
}
.man-hinh .ghichu{font-size:14px; color:#CADBE7}
.hoc h2{font-size:24px; margin:0 0 16px; line-height:1.3; color:var(--do-sau)}
.baitap{
  margin-top:28px; padding:18px; background:var(--the); border:1.5px solid var(--vien); border-radius:4px;
}
.baitap h3{font-size:20px; margin-bottom:14px}
.baitap .luu-y{margin:0 0 14px; font-size:14px; color:var(--muc-nhat)}
.ngulieu{margin:0 0 6px; border:1.5px solid var(--vien); border-radius:6px; background:var(--giay)}
.ngulieu summary{cursor:pointer; min-height:44px; padding:9px 14px; font-weight:600}
.vanban{padding:12px 14px 14px; border-top:1px solid var(--vien); background:#fff; line-height:1.75; overflow-wrap:anywhere}
.vanban p{margin:0}
.vanban.tho p{white-space:nowrap; overflow:hidden}
.vanban.tho p.tieude,.vanban.tho p.tacgia,.vanban.tho p.trich,.vanban.tho p.chuthich{white-space:normal}
.vanban.tho p.xuong{white-space:normal; padding-left:1.5em; text-indent:-1.5em}
@media (max-width:599px){
  .baitap{padding-left:12px; padding-right:12px}
  .vanban.tho{padding-left:8px; padding-right:8px}
}
/* Ngữ liệu truyện: canh đều hai bên, thụt đầu dòng (trích nguồn và chú thích giữ nguyên) */
.vanban.truyen p{text-align:justify; text-indent:2em}
.vanban.truyen p.chuthich{text-align:left; text-indent:0}
.vanban p.trich,.vanban.truyen p.trich{text-align:right; text-indent:0}
.vanban p.tieude,.vanban.truyen p.tieude{text-align:center; text-indent:0; font-weight:600}
.vanban p.tacgia,.vanban.truyen p.tacgia{text-align:center; text-indent:0}
.vanban .ngat{height:.8em}
.vanban img{display:block; width:100%; height:auto}
.vanban .chuthich{margin-top:10px; font-size:14px; color:var(--muc-nhat)}
.cau .hoi .nguon{text-align:right; margin-top:6px; font-size:12px; line-height:1.45; color:var(--muc-nhat)}
.vanban .trich{margin-top:10px; font-size:14px; line-height:1.5; color:var(--muc-nhat)}
.cau{margin:18px 0 26px}
.cau .hoi{margin:0 0 10px}
.cau .hoi p{margin:0 0 4px; text-align:justify}
.cau textarea{display:block; width:100%; min-height:120px; resize:vertical; padding:10px 12px; margin-bottom:10px; border:1.5px solid var(--nau); border-radius:6px; background:#fff; color:var(--muc); font:inherit; font-size:16px}
.cau textarea:focus-visible{outline:3px solid var(--vien); outline-offset:1px}
.giai{margin-top:10px; padding:12px 14px; border-left:4px solid var(--do); border-radius:0 6px 6px 0; background:var(--giay); line-height:1.7; overflow-wrap:anywhere}
.giai p{margin:0 0 6px}
.giai b{display:block; margin-bottom:6px}
.khoa-bt{margin:0; padding:16px; text-align:center; color:var(--muc-nhat); background:var(--giay); border:1.5px dashed var(--vien); border-radius:6px}
.baitap .btn{width:100%}
.baitap .btn:disabled{opacity:.5; cursor:not-allowed}
.cau .goi-y{margin:0 0 8px; font-size:13px; color:var(--muc-nhat)}

/* ===== Chân trang ===== */
footer{padding:20px 0 32px; text-align:center; color:var(--muc-nhat); font-size:14px}
footer .btn-phu{margin-top:8px; font-size:14px}

/* Màn Vào học vừa khít màn hình (điện thoại và web) */
#man-vao{min-height:100vh; min-height:100dvh; display:flex; flex-direction:column; padding:10px 0 12px; box-sizing:border-box}
#man-vao .wrap{flex:1; display:flex; flex-direction:column; width:100%}
#man-vao .khung{flex:1; display:flex}
#man-vao .khung-trong{flex:1; width:100%; display:grid; grid-template-columns:minmax(0,1fr); grid-template-rows:auto 1fr auto 1fr auto; padding-bottom:8px}
#man-vao .logos{grid-row:1; margin-bottom:0; height:36px; align-items:center}
#man-vao h1{grid-row:2; align-self:center; margin:0}
#man-vao #form-vao{grid-row:3; margin:0}
#man-vao .hang-ma{margin-bottom:0}
#man-vao .gioi-thieu{grid-row:5; margin:0; height:36px; display:flex; align-items:center; justify-content:center; white-space:normal; text-align:center}

@media (min-width:600px){
  body{font-size:17px}
  #man-vao .khung-trong{padding:16px 40px 16px}
  #man-vao .wrap{max-width:560px}
  .khung-trong h1{font-size:34px}
  #man-vao{padding:20px 0}
  .ds{grid-template-columns:1fr 1fr}
  .hs{font-size:16px}
  .chao h2{font-size:28px}
}

/* Web (bố cục ngang, cỡ chuẩn 1366x768, 1920x1080): tên bên trái, nhập mã bên phải */
@media (min-width:900px){
  #man-hoc .wrap{max-width:1120px}
  .hoc{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); grid-template-areas:"mh bt"; column-gap:36px; padding-top:28px}
  .hoc .cot-video{position:sticky; top:16px; align-self:start; max-height:calc(100vh - 32px); overflow:auto}
  .hoc .baitap{margin-top:0; align-self:start}
  .hoc h2{font-size:30px}
  #man-vao .wrap{max-width:1120px}
  #man-vao .khung-trong{grid-template-columns:1fr 1fr; grid-template-rows:auto 1fr auto; padding:18px 64px 18px}
  #man-vao .logos{grid-column:1 / -1; grid-row:1}
  #man-vao h1{grid-column:1; grid-row:2; font-size:56px; line-height:1.15; padding-right:40px}
  #man-vao #form-vao{grid-column:2; grid-row:2; align-self:center; padding:8px 0 8px 48px; border-left:1px solid var(--vien)}
  #man-vao .gioi-thieu{grid-column:1 / -1; grid-row:3}
}

/* Trang chủ: điện thoại chọn Thơ hoặc Truyện bằng 2 nút; web xếp 2 cột */
#man-chu .chao{padding:14px 0 0}
#man-chu .chao h2{margin:0}
.tab{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:12px 0}
.tab button{min-height:44px; border:1.5px solid var(--nau); border-radius:6px; background:var(--the); color:var(--muc); font:inherit; font-weight:600; cursor:pointer}
.tab button[aria-pressed="true"]{background:var(--do); border-color:var(--do); color:#fff}
#man-chu .nhom{margin-top:0}
#man-chu .nhom h3{position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%)}
.cac-nhom[data-chon="tho"] .nhom-truyen,.cac-nhom[data-chon="truyen"] .nhom-tho{display:none}
#man-chu .ds{gap:8px}
#man-chu .ds li{display:flex}
#man-chu .the{min-height:56px; padding:7px 10px; gap:10px}
#man-chu .the .tg{font-size:13px}
#man-chu .sap{margin:14px 0 20px; padding:9px 12px; font-size:14px}
@media (max-width:599px){
  #man-chu .chao p{font-size:15px; margin-top:2px}
  #man-chu .chao h2{font-size:21px}
  .tab{margin:10px 0}
  #man-chu .ds{gap:6px}
  #man-chu .the{min-height:48px; padding:5px 8px; gap:8px}
  #man-chu .the .stt{width:26px; height:26px; font-size:13px}
  #man-chu .the .ten{font-size:15px; line-height:1.25}
  #man-chu .the .tg{font-size:12px; line-height:1.35}
  #man-chu .tt{font-size:11px; padding:2px 6px}
  #man-chu .sap{margin:10px 0 12px; padding:6px 10px; font-size:13px}
}
@media (min-width:900px){
  #man-chu .wrap{max-width:1120px}
  .tab{display:none}
  #man-chu .chao{padding:12px 0 10px}
  #man-chu .the{min-height:50px; padding:4px 10px}
  #man-chu .sap{margin:10px 0 14px}
  .cac-nhom{display:grid; grid-template-columns:1fr 1fr; gap:32px; align-items:start}
  .cac-nhom[data-chon] .nhom{display:block}
  #man-chu .nhom h3{position:static; width:auto; height:auto; overflow:visible; clip-path:none}
  #man-chu .ds{grid-template-columns:1fr}
}

/* Điện thoại, máy tính bảng: hiện đủ cả Thơ và Truyện trên Trang chủ (không còn 2 nút chọn), thẻ gọn để vừa màn hình */
@media (max-width:899px){
  #man-chu .tab{display:none}
  #man-chu .cac-nhom .nhom{display:block}
  #man-chu .ds{grid-template-columns:minmax(0,1fr)}
  #man-chu .ds li{min-width:0}
  #man-chu .nhom h3{position:static; width:auto; height:auto; overflow:visible; clip-path:none; font-size:17px; margin:8px 0 5px; padding-bottom:2px}
}
@media (max-width:599px){
  #man-chu .thanh .wrap{min-height:46px; padding-top:3px; padding-bottom:3px}
  #man-chu .chao{padding:8px 0 0}
  #man-chu .chao h2{font-size:18px}
  #man-chu .chao p{font-size:13px; margin-top:0}
  #man-chu .ds{gap:3px}
  #man-chu .the{min-height:36px; padding:1px 6px; gap:6px}
  #man-chu .the .stt{width:20px; height:20px; font-size:11px}
  #man-chu .the .ten{font-size:14.5px}
  #man-chu .tt{font-size:10px; padding:1px 5px; border-width:1px}
  #man-chu .nhom h3{font-size:20px; margin:5px 0 3px; line-height:1.2}
  #man-chu .chao{padding-top:5px}
  #man-chu .chao h2{font-size:17px; line-height:1.2}
  #man-chu .sap{margin:5px 0; padding:2px 8px; font-size:11px; line-height:1.4}
}

/* Tên nhóm THƠ, TRUYỆN viết hoa, to hơn */
#man-chu .nhom h3{text-transform:uppercase; letter-spacing:.08em; color:var(--do-sau)}
@media (min-width:900px){ #man-chu .nhom h3{font-size:24px} }

/* Lời chào ở Trang chủ canh giữa */
#man-chu .chao{text-align:center}

/* Máy tính: dùng gần hết bề ngang, chỉ chừa mép nhỏ hai bên */
@media (min-width:900px){
  #man-vao .wrap, #man-chu .wrap, #man-hoc .wrap{max-width:none; width:100%; box-sizing:border-box; padding-left:2.5vw; padding-right:2.5vw}
  #man-vao h1{font-size:clamp(56px, 4.8vw, 96px)}
  #man-vao #form-vao{width:100%; max-width:660px; box-sizing:border-box; justify-self:start}
  #man-chu .wrap, #man-hoc .wrap{padding-left:16px; padding-right:16px}
}
/* Màn Vào học: khung phủ kín trang trên mọi máy, không chừa mép */
#man-vao{padding:0}
#man-vao .wrap{padding:0; max-width:none}
#man-vao .khung{border-radius:0; box-shadow:none}


/* Điểm cộng */
.thong-bao-diem{margin:10px 0 0; padding:10px 14px; border-radius:6px; border:1.5px solid #B7791F; background:#FFF6E0; color:#6B4A0F; font-weight:600; font-size:15px; text-align:center}
.thong-bao-diem.duoc{border-color:#2F7D4F; background:#E7F5EC; color:#1F5A38}
#man-chu .chao p.may-phu{color:#8A5A0A; font-weight:600}

</style>
</head>
<body>

<!-- MÀN 1: VÀO HỌC -->
<main id="man-vao" class="man">

      return taiTuKho(duong,bao).then(function(blob){
        if(!dungLuu){return blob;}
        return caches.open(TEN_LUU).then(function(c){
          return c.keys().then(function(ds){
            return Promise.all(ds.filter(function(k){return k.url.split('?')[0]===goc;}).map(function(k){return c.delete(k);}));
          }).then(function(){return c.put(khoaLuu,new Response(blob));});
        }).catch(function(){}).then(function(){return blob;});
      });
    });
  }
  function taiJson(duong){return taiFile(duong).then(function(b){return b.text();}).then(JSON.parse);}

  /* Lượt học: gửi không được (mất mạng) thì giữ lại, lần vào sau gửi tiếp */
  function guiLuot(m){return ham('ghi_hoat_dong',{p_ma:m.ma,p_bai:m.bai,p_loai:m.loai});}
  function xepCho(m){var c=docLai(TEN_CHO)||[]; c.push(m); ghiLai(TEN_CHO,c.slice(-50));}
  function guiCho(){
    var c=docLai(TEN_CHO)||[];
    var cuaToi=c.filter(function(x){return x.ma===ma;});
    if(!cuaToi.length){return Promise.resolve();}
    ghiLai(TEN_CHO,c.filter(function(x){return x.ma!==ma;}));
    return cuaToi.reduce(function(truoc,m){
      return truoc.then(function(){return guiLuot(m).catch(function(){xepCho(m);});});
    },Promise.resolve());
  }
  function laySoLan(){
    return ham('so_lan_hoc',{p_ma:ma}).then(function(ds){
      dem={}; (ds||[]).forEach(function(x){dem[x.ten_bai]=Number(x.so_lan);});
    }).catch(function(){dem={};});
  }

  /* Điểm cộng. Kho chưa bật (chưa chạy diem-cong.sql) thì diem=null, trang chạy như cũ. */
  function layDiem(){
    return ham('trang_thai_diem',{p_ma:ma}).then(function(d){
      diem=d?{mayTinhDiem:!!d.may_tinh_diem}:null; daTinh={};
      ((d&&d.bai)||[]).forEach(function(b){daTinh[b]=true;});
    }).catch(function(){diem=null; daTinh={};});
  }
  function guiDiem(m){
    return ham('xong_bai',{p_luot:m.luot,p_so_lan:m.soLan}).then(function(kq){
      if(m.ma===ma&&(kq==='tinh'||kq==='da_tinh')){daTinh[m.bai]=true;}
      return kq;
    });
  }
  /* Lượt xong mà mất mạng: giữ lại, lần vào sau gửi tiếp */
  function guiDiemCho(){
    var c=docLai(TEN_CHO_DIEM)||[];
    var cuaToi=c.filter(function(x){return x.ma===ma;});
    if(!cuaToi.length){return Promise.resolve();}
    ghiLai(TEN_CHO_DIEM,c.filter(function(x){return x.ma!==ma;}));
    return cuaToi.reduce(function(truoc,m){
      return truoc.then(function(){return guiDiem(m).catch(function(){xepChoDiem(m);});});
    },Promise.resolve());
  }
  function xepChoDiem(m){var c=docLai(TEN_CHO_DIEM)||[]; c.push(m); ghiLai(TEN_CHO_DIEM,c.slice(-50));}
  /* Gọi khi bấm "Bắt đầu học"; mất mạng thì thử lại một lần */
  function batDau(bai){
    var goiKho=function(){return ham('bat_dau_bai',{p_ma:ma,p_bai:bai});};
    return goiKho().catch(function(){
      return new Promise(function(xong){setTimeout(xong,3000);}).then(goiKho);
    }).catch(function(){return null;});
  }

  /* Cho phép gõ thường, gõ thiếu dấu gạch */
  function chuanMa(m){
    m=m.replace(/\s/g,'').replace(/[–—]/g,'-').toUpperCase();
    var k=m.match(/^([A-Z]{2,3}\d)(\d{3})$/);
    return k?k[1]+'-'+k[2]:m;
  }
  return {
    vao:function(nhap){
      var m=chuanMa(nhap);
      return ham('vao_hoc',{p_ma:m}).then(function(kq){
        if(kq!=='ok'){return {ketQua:kq};}
        ma=m;
        return Promise.all([taiJson('muc-luc.json'),taiJson('bai-tap.json'),guiCho().then(laySoLan),guiDiemCho().then(layDiem)]).then(function(r){
          return {ketQua:'ok',ma:m,hocLieu:r[0],baiTap:r[1]};
        });
      });
    },
    taiBai:function(hl,bao){
      return Promise.all([taiFile(hl.bai),taiFile(hl.video,bao)]).then(function(r){
        var diaChi=URL.createObjectURL(new Blob([r[1]],{type:'video/mp4'}));
        diaChiVideo.push(diaChi);
        return r[0].text().then(function(h){return h.replace('__VIDEO__',function(){return diaChi;});});
      });
    },
    ghi:function(bai,loai){
      if(!ma){return;}
      if(loai==='xem_xong'){dem[bai]=(dem[bai]||0)+1;}
      var m={ma:ma,bai:bai,loai:loai};
      guiLuot(m).catch(function(){xepCho(m);});
    },
    soLan:function(bai){return dem[bai]||0;},
    diem:function(){return diem;},
    daTinh:function(bai){return !!daTinh[bai];},
    batDau:batDau,
    /* luot: lời hứa từ batDau; soLan: mỗi câu bấm mấy lần. Trả về kết quả để báo cho học sinh */
    xong:function(luot,bai,soLan){
      return Promise.resolve(luot).then(function(id){
        if(!id){return 'mat_mang';}
        var m={ma:ma,luot:id,bai:bai,soLan:soLan};
        return guiDiem(m).catch(function(){xepChoDiem(m); return 'cho_gui';});
      });
    },
    dong:function(){diaChiVideo.splice(0).forEach(function(d){URL.revokeObjectURL(d);});}
  };
})();
</script>

<script>
(function(){
  var THO=[["Hình ảnh trong thơ","3:07",1],["Các phép tu từ","4:36",1],["Thể thơ, vần, nhịp","3:56",0],["Cảm xúc, cảm hứng chủ đạo","3:36",0],["Giá trị của bài thơ","4:54",0],["Nhận biết nhân vật trữ tình","2:38",0],["Tượng trưng, siêu thực","4:55",0],["Chủ đề, tư tưởng, thông điệp","3:28",0]];
  var TRUYEN=[["Ngôi kể, điểm nhìn","5:00",1],["Phong cách cổ điển, hiện thực, lãng mạn","6:33",0],["Thay đổi điểm nhìn trần thuật","5:10",0],["Vai trò của chi tiết, sự kiện, nhân vật","5:13",0],["Yếu tố kì ảo","5:33",1],["Yếu tố truyện ngắn hiện đại","7:21",0]];
  var man={vao:document.getElementById('man-vao'),chu:document.getElementById('man-chu'),hoc:document.getElementById('man-hoc')};
  var mang=document.getElementById('mang-yeu');
  var lastBtn=null;

  function hien(ten){
    for(var k in man){man[k].hidden=(k!==ten);}
    setTimeout(chinhTenBai,0);
    window.scrollTo(0,0);
  }
  function dung(ul,ds,tien){
    ds.forEach(function(b,i){
      var li=document.createElement('li');
      var bt=document.createElement('button');
      bt.type='button'; bt.className='the';
      bt.innerHTML='<span class="stt" aria-hidden="true">'+(i+1)+'</span>'+
        '<span class="noidung"><span class="ten"></span></span>'+
        '<span class="tt">Chưa học</span>';
      bt.querySelector('.ten').textContent=b[0];
      bt.addEventListener('click',function(){mo(b,bt,i+1);});
      li.appendChild(bt); ul.appendChild(li);
    });
  }
  dung(document.getElementById('ds-tho'),THO);
  dung(document.getElementById('ds-truyen'),TRUYEN);
  ['tho','truyen'].forEach(function(loai){
    document.getElementById('tab-'+loai).addEventListener('click',function(){
      document.querySelector('.cac-nhom').setAttribute('data-chon',loai);
      setTimeout(chinhTenBai,0);
      document.getElementById('tab-tho').setAttribute('aria-pressed',String(loai==='tho'));
      document.getElementById('tab-truyen').setAttribute('aria-pressed',String(loai==='truyen'));
    });
  });

  function tao(the,lop,chu){
    var e=document.createElement(the); if(lop)e.className=lop; if(chu!==undefined)e.textContent=chu; return e;
  }
  /* Thơ: giữ đúng hình thức, mỗi dòng thơ một hàng. Thu nhỏ cỡ chữ cả ngữ liệu theo dòng dài nhất;
     không nhỏ hơn CO_NHO_NHAT, dòng nào vẫn quá dài thì xuống hàng và thụt vào. */
  var CO_NHO_NHAT=10;
  function vuaDong(v){
    if(!v.clientWidth)return;
    var ds=[].slice.call(v.querySelectorAll('p:not(.tieude):not(.tacgia):not(.trich):not(.chuthich)'));
    if(!ds.length)return;
    ds.forEach(function(p){p.classList.remove('xuong'); p.style.fontSize='';});
    var goc=parseFloat(getComputedStyle(ds[0]).fontSize), co=goc, qua=false;
    ds.forEach(function(p){
      if(p.scrollWidth<=p.clientWidth)return;
      var can=Math.floor(goc*p.clientWidth/p.scrollWidth*0.99*10)/10;
      if(can>=CO_NHO_NHAT){co=Math.min(co,can);}else{qua=true;}
    });
    if(co===goc&&!qua)return;
    if(co!==goc){ds.forEach(function(p){p.style.fontSize=co+'px';});}
    ds.forEach(function(p){if(p.scrollWidth>p.clientWidth){p.classList.add('xuong');}});
  }
  function giuMotDong(v){
    var rong=-1;
    var chinh=function(){if(v.clientWidth!==rong){rong=v.clientWidth; vuaDong(v);}};
    if(window.ResizeObserver){new ResizeObserver(chinh).observe(v);}
    else{window.addEventListener('resize',chinh); setTimeout(chinh,0);}
    if(document.fonts){document.fonts.ready.then(function(){rong=-1; chinh();});}
  }
  function veBaiTap(tenBai){
    var o=document.getElementById('ds-baitap'); o.textContent='';
    var ds=(window.BAITAP||{})[tenBai];
    if(!ds||!ds.length){o.appendChild(tao('p','luu-y','Phần thực hành sẽ được thêm sau.'));return;}
    o.appendChild(tao('p','luu-y','Viết câu trả lời rồi bấm “Xem bài giải” để đối chiếu.'));
    var so=0;
    ds.forEach(function(g,n){
      var d=tao('details','ngulieu'); d.open=true;
      d.appendChild(tao('summary','',ds.length>1?'Ngữ liệu '+(n+1):'Ngữ liệu'));
      var laTruyen=TRUYEN.some(function(x){return x[0]===tenBai;});
      var v=tao('div',laTruyen?'vanban truyen':'vanban tho');
      g.ngu.forEach(function(x){
        if(x===''){v.appendChild(tao('div','ngat'));return;}
        if(typeof x==='string'){v.appendChild(tao('p','',x));return;}
        if(x.tieude){v.appendChild(tao('p','tieude',x.tieude));return;}
        if(x.tacgia){v.appendChild(tao('p','tacgia',x.tacgia));return;}
        if(x.trich){var q=tao('p','trich');x.trich.split('*').forEach(function(y,j){q.appendChild(j%2?tao('i','',y):document.createTextNode(y));});v.appendChild(q);return;}
        var a=tao('img'); a.src=x.anh; a.alt=x.moTa; a.loading='lazy'; v.appendChild(a);
      });
      g.chu.forEach(function(x){v.appendChild(tao('p','chuthich',x));});
      d.appendChild(v); o.appendChild(d);
      if(!laTruyen){giuMotDong(v);}
      g.cau.forEach(function(c){
        so++;
        var k=tao('div','cau'), h=tao('div','hoi');
        c.hoi.forEach(function(x,j){
          var p=tao('p'); if(j===0){p.appendChild(tao('b','','Câu hỏi: '));}
          p.appendChild(document.createTextNode(x)); h.appendChild(p);
        });
        if(c.nguon){h.appendChild(tao('p','nguon','Nguồn đề: '+c.nguon+'.'));}
        var t=tao('textarea'); t.setAttribute('aria-label','Bài làm câu '+so); t.placeholder='Viết câu trả lời ở đây…';
        var nut=tao('button','btn btn-phu','Xem bài giải'); nut.type='button'; nut.setAttribute('aria-expanded','false');
        var gi=tao('div','giai'); gi.hidden=true; gi.appendChild(tao('b','','Bài giải'));
        c.giai.forEach(function(x){gi.appendChild(tao('p','',x));});
        // Bài giải chỉ mở khi em đã viết câu trả lời (ít nhất TOI_THIEU ký tự)
        var TOI_THIEU=10, goiY=tao('p','goi-y','Viết câu trả lời trước, sau đó mới xem được bài giải.');
        nut.disabled=true;
        t.addEventListener('input',function(){
          var du=t.value.trim().length>=TOI_THIEU;
          nut.disabled=!du&&gi.hidden; goiY.hidden=du||!gi.hidden;
        });
        nut.addEventListener('click',function(){
          gi.hidden=!gi.hidden; nut.textContent=gi.hidden?'Xem bài giải':'Ẩn bài giải';
          nut.setAttribute('aria-expanded',String(!gi.hidden));
        });
        k.appendChild(h); k.appendChild(t); k.appendChild(goiY); k.appendChild(nut); k.appendChild(gi); o.appendChild(k);
      });
    });
  }
  /* Học liệu thật: chỉ tải khi em bấm "Mở bài học"; rời trang thì gỡ ra để tắt tiếng */
  var baiDangMo=null, henCham=null, theoDoiCao=null, lanTai=0, dangNghe=false;
  // dangNghe: đang nghe một lượt (lần đầu hoặc nghe lại) thì phần thực hành khoá đến khi nghe xong
  function datDangNghe(co){dangNghe=co; capNhatKhoa();}
  function dongHocLieu(){
    clearTimeout(henCham); if(theoDoiCao){theoDoiCao.disconnect(); theoDoiCao=null;}
    lanTai++; if(window.KHO){window.KHO.dong();}
    baoDiem(''); dangNghe=false;
    var k=document.getElementById('khung-hl'); k.textContent=''; k.hidden=true;
    document.getElementById('bia-hl').hidden=false; mang.hidden=true;
    var nut=document.getElementById('nut-bat-dau'), hl=(window.HOCLIEU||{})[baiDangMo];
    nut.disabled=!hl; nut.textContent='▶ Mở bài học';
    document.getElementById('ghichu-khung').textContent=hl?'Dung lượng khoảng '+String(hl.mb).replace('.',',')+' MB.':'Bài này chưa có video.';
  }
  function moHocLieu(){
    var hl=(window.HOCLIEU||{})[baiDangMo]; if(!hl)return;
    var k=document.getElementById('khung-hl'), nut=document.getElementById('nut-bat-dau'), ghi=document.getElementById('ghichu-khung');
    k.textContent=''; nut.disabled=true; nut.textContent='Đang tải…'; ghi.textContent='Đợi một chút nhé.';
    datDangNghe(true);
    var f=document.createElement('iframe');
    f.title='Bài học: '+baiDangMo; f.setAttribute('allow','autoplay; fullscreen'); f.setAttribute('allowfullscreen','');
    f.className='dang-tai';
    f.addEventListener('load',function(){
      var d=null; try{d=f.contentDocument;}catch(e){}
      if(d&&!d.getElementById('player')){
        if(d.URL==='about:blank')return;
        clearTimeout(henCham); mang.hidden=true; k.textContent=''; k.hidden=true;
        nut.disabled=false; nut.textContent='Thử lại'; ghi.textContent='Chưa tải được bài học. Kiểm tra mạng rồi bấm Thử lại.';
        datDangNghe(false);
        return;
      }
      clearTimeout(henCham); mang.hidden=true;
      document.getElementById('bia-hl').hidden=true; f.className='';
      if(!d)return;
      // Khi học liệu hiện màn "Em đã hoàn thành bài học" thì mở bài tập
      var xong=d.getElementById('done'), tenBai=baiDangMo;
      if(window.KHO){window.KHO.ghi(tenBai,'mo_bai');}
      var luot=null, coDiem=!!(window.KHO&&window.KHO.diem()), lanBai=lanTai;
      ['startBtn','againBtn'].forEach(function(id){
        var n=d.getElementById(id);
        if(n){n.addEventListener('click',function(){datDangNghe(true);});}
      });
      if(coDiem){
        ['startBtn','againBtn'].forEach(function(id){
          var n=d.getElementById(id);
          if(n){n.addEventListener('click',function(){baoDiem(''); luot=window.KHO.batDau(tenBai);});}
        });
      }
      if(xong){new MutationObserver(function(){
        if(xong.hidden)return;
        dangNghe=false;
        danhDauXong(tenBai);
        if(coDiem){
          // Học liệu ghi sẵn "Câu 1: N lần chọn · ..." ở màn hoàn thành
          var chu=(d.getElementById('doneText')||{}).textContent||'';
          var soLanChon=(chu.match(/\d+(?= lần chọn)/g)||[]).map(Number);
          window.KHO.xong(luot,tenBai,soLanChon).then(function(kq){
            capNhatSoLan(); if(lanBai===lanTai){baoDiem(kq);}
          });
        }
      }).observe(xong,{attributes:true,attributeFilter:['hidden']});}
      // Cho học liệu khớp với trang: nền sáng, bỏ lề và tiêu đề lặp, khung tự cao theo nội dung
      d.documentElement.setAttribute('data-theme','light');
      var st=d.createElement('style');
      st.textContent='html,body{margin:0!important;background:transparent!important}body{padding:0 0 4px!important}.wrap{max-width:100%!important}header h1{display:none}';
      d.head.appendChild(st);
      var chinh=function(){f.style.height=Math.ceil(d.body.getBoundingClientRect().height)+2+'px';};
      chinh();
      if(f.contentWindow.ResizeObserver){theoDoiCao=new f.contentWindow.ResizeObserver(chinh); theoDoiCao.observe(d.body);}
    });
    if(window.KHO){
      var lan=++lanTai;
      window.KHO.taiBai(hl,function(pt){if(lan===lanTai){nut.textContent='Đang tải… '+pt+'%';}}).then(function(html){
        if(lan!==lanTai)return;
        f.srcdoc=html; k.appendChild(f); k.hidden=false;
      }).catch(function(e){
        if(lan!==lanTai)return;
        clearTimeout(henCham); mang.hidden=true;
        nut.disabled=false; nut.textContent='Thử lại';
        ghi.textContent=e&&e.loai==='khoa'?'Mã không còn mở. Hãy hỏi thầy cô.':'Chưa tải được bài học. Kiểm tra mạng rồi bấm Thử lại.';
        datDangNghe(false);
      });
    }else{
      f.src=hl.file;
      k.appendChild(f); k.hidden=false;
    }
    henCham=setTimeout(function(){mang.hidden=false;},5000);
  }
  /* Bài tập chỉ hiện sau khi em xem xong video (máy nhớ bài đã xem xong) */
  var maHS='', demTam={};
  function khoaLan(ten){return 'lan-hoc:'+maHS+':'+ten;}
  function soLan(ten){
    if(window.KHO){return window.KHO.soLan(ten);}
    var k=khoaLan(ten), n=0;
    try{n=parseInt(localStorage.getItem(k),10)||0;}catch(e){}
    return Math.max(n,demTam[k]||0);
  }
  function xemXong(ten){return soLan(ten)>0;}
  function capNhatSoLan(){
    [].forEach.call(document.querySelectorAll('#man-chu .the'),function(the){
      var n=soLan(the.querySelector('.ten').textContent), nhan=the.querySelector('.tt');
      var sao=!!(window.KHO&&window.KHO.daTinh(the.querySelector('.ten').textContent));
      nhan.textContent=sao?(n?'★ Học '+n+' lần':'★ Đã cộng'):(n?'✓ Học '+n+' lần':'Chưa học');
      nhan.className=(n||sao)?'tt da':'tt';
    });
    var dm=window.KHO&&window.KHO.diem(), loiChao=document.querySelector('#man-chu .chao p');
    if(dm){
      loiChao.textContent=dm.mayTinhDiem?'★ là bài đã được cộng điểm. Chọn một bài nhé!':'Máy này chỉ để xem, không được cộng điểm.';
      loiChao.classList.toggle('may-phu',!dm.mayTinhDiem);
    }
  }
  function capNhatKhoa(){
    var coBai=((window.BAITAP||{})[baiDangMo]||[]).length>0;
    var khoa=coBai&&(dangNghe||!xemXong(baiDangMo));
    document.getElementById('khoa-bt').hidden=!khoa;
    document.getElementById('ds-baitap').hidden=khoa;
  }
  var LOI_DIEM={
    tinh:'★ Đã được cộng điểm cho bài này.',
    da_tinh:'★ Bài này đã được cộng điểm từ trước.',
    may_phu:'Lượt xem chưa được cộng điểm do đang sử dụng điện thoại/máy tính khác.',
    nhanh_qua:'Lượt này chưa được cộng điểm vì thời gian học quá ngắn.',
    thieu_cau:'Lượt này chưa được cộng điểm vì chưa trả lời đủ câu hỏi.',
    mat_mang:'Lượt này chưa được cộng điểm vì mất mạng lúc bắt đầu. Bấm “Học lại từ đầu” để được cộng.',
    cho_gui:'Mạng yếu, kết quả sẽ được gửi ở lần vào học sau.',
    khong_hop_le:'Lượt này chưa được cộng điểm. Hãy vào học lại.'
  };
  function baoDiem(kq){
    var o=document.getElementById('thong-bao-diem');
    o.textContent=kq?(LOI_DIEM[kq]||LOI_DIEM.khong_hop_le):'';
    o.className='thong-bao-diem'+(kq==='tinh'||kq==='da_tinh'?' duoc':'');
    o.hidden=!kq;
  }
  function danhDauXong(ten){
    // Mỗi lần video chạy tới màn "đã hoàn thành" tính là một lần học
    if(window.KHO){window.KHO.ghi(ten,'xem_xong');}
    else{
      var n=soLan(ten)+1, k=khoaLan(ten);
      demTam[k]=n; try{localStorage.setItem(k,String(n));}catch(e){}
    }
    capNhatSoLan();
    if(ten===baiDangMo){capNhatKhoa();}
  }
  /* Điện thoại: tên bài (Trang chủ và Trang học) nằm gọn một hàng, tự thu cỡ chữ nếu dài */
  function vuaMotHang(ds){
    var hep=window.innerWidth<600;
    ds.forEach(function(e){
      e.style.fontSize=''; e.style.whiteSpace=hep?'nowrap':'';
      if(!hep||!e.clientWidth||e.scrollWidth<=e.clientWidth)return;
      var co=parseFloat(getComputedStyle(e).fontSize);
      while(e.scrollWidth>e.clientWidth&&co>10.5){co-=0.5; e.style.fontSize=co+'px';}
      if(e.scrollWidth>e.clientWidth){e.style.whiteSpace='';}
    });
  }
  function chinhTenBai(){vuaMotHang([].slice.call(document.querySelectorAll('#ten-bai, #man-chu .the .ten')));}
  window.addEventListener('resize',chinhTenBai);
  if(document.fonts){document.fonts.ready.then(chinhTenBai); document.fonts.addEventListener('loadingdone',chinhTenBai);}
  function mo(b,bt,so){
    lastBtn=bt||null;
    document.getElementById('ten-bai').textContent=(so?'Bài '+so+'. ':'')+b[0];
    veBaiTap(b[0]);
    baiDangMo=b[0]; dongHocLieu(); capNhatKhoa();
    hien('hoc');
    document.getElementById('ten-bai').setAttribute('tabindex','-1');
    chinhTenBai();
    document.getElementById('ten-bai').focus({preventScroll:true});
  }

  var loi=document.getElementById('loi-vao'), inp=document.getElementById('ma');
  function baoLoi(tieude,nd){
    loi.innerHTML='<b></b><span></span>';
    loi.firstChild.textContent=tieude; loi.lastChild.textContent=nd;
    loi.hidden=false; inp.setAttribute('aria-invalid','true');
  }
  /* Bản chạy thật: kiểm tra mã và lấy học liệu từ kho riêng (window.KHO chỉ có ở bản đăng) */
  var THONG_BAO={
    sai:['Mã chưa đúng','Kiểm tra lại mã rồi nhập lại nhé.'],
    khoa:['Mã bị khoá','Mã này đang bị khoá, hãy hỏi thầy cô.'],
    du_thiet_bi:['Mã đã dùng đủ','Mã này đã dùng trên 2 thiết bị. Hãy nhờ thầy cô mở lại.'],
    cho:['Thử lại sau','Đã nhập sai nhiều lần. Đợi khoảng 15 phút rồi thử lại.'],
    dong:['Đang đông người vào','Đợi vài phút rồi bấm Vào học lại.'],
    mang:['Chưa kết nối được','Kiểm tra mạng rồi bấm Vào học lại.']
  };
  var nutVao=document.querySelector('#form-vao button');
  function vaoBangKho(m){
    if(nutVao.disabled)return;
    nutVao.disabled=true; nutVao.textContent='Đang vào…';
    window.KHO.vao(m).then(function(r){
      if(r.ketQua!=='ok'){baoLoi.apply(null,THONG_BAO[r.ketQua]||THONG_BAO.mang); inp.focus(); return;}
      window.HOCLIEU=r.hocLieu; window.BAITAP=r.baiTap;
      maHS=r.ma; inp.value=r.ma;
      document.querySelectorAll('.ten-hs').forEach(function(x){x.textContent=r.ma;});
      capNhatSoLan(); hien('chu');
    }).catch(function(e){baoLoi.apply(null,THONG_BAO[e&&e.loai]||THONG_BAO.mang);})
    .then(function(){nutVao.disabled=false; nutVao.textContent='Vào học';});
  }

  document.getElementById('form-vao').addEventListener('submit',function(e){
    e.preventDefault();
    var m=inp.value.trim().toUpperCase(); inp.value=m;
    loi.hidden=true; inp.removeAttribute('aria-invalid');
    if(window.KHO){vaoBangKho(m); return;}
  });
  inp.addEventListener('input',function(){inp.value=inp.value.toUpperCase();});

  document.getElementById('nut-quay').addEventListener('click',function(){
    dongHocLieu(); hien('chu'); if(lastBtn){lastBtn.focus();}
  });
  document.getElementById('nut-bat-dau').addEventListener('click',moHocLieu);
})();
</script>
</body>
</html>
